<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NubeBar · Panel de red</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8DA9E8}a:hover{color:#B8C7EC}
.nb{--plata:#C9D2E6;--acero:#5E6E8F;--coral:#D9826E;--verde:#8FC1A0;--texto:#E6E9F2;--tenue:#9AA3B8;--filo:rgba(255,255,255,.09);--panel:rgba(12,14,20,.94);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--texto)}
.nb *{box-sizing:border-box}
.nb button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.nb button:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes fluir{to{background-position:-250% center}}
@keyframes entrar{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes medir{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

.isla-borde{position:absolute;top:10px;right:20px;width:760px;border-radius:23px;padding:1px;overflow:hidden;isolation:isolate;background:var(--filo);z-index:2}
.isla-borde::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:linear-gradient(90deg,transparent 40%,rgba(201,210,230,.6) 49%,var(--acento) 51%,transparent 60%);animation:girar 9s linear infinite;z-index:-1}
.isla{display:flex;align-items:center;justify-content:flex-end;gap:6px;height:46px;padding:0 12px;border-radius:22px;background:var(--panel)}
.isla img{width:22px;height:22px;display:block}
.isla .oscuro{filter:drop-shadow(0 0 3px rgba(255,255,255,.85))}
.sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 5px}
.ic{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--plata)}
.ic.abierto{background:rgba(141,169,232,.18);color:#fff}
.chip-es{font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--plata)}
.reloj{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--texto) 40%,#fff 50%,var(--texto) 60%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fluir 7s linear infinite}
.fecha{font-size:13px;color:var(--plata);padding:0 4px}
.insignia{position:absolute;top:2px;right:1px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--coral);color:#1a0f0c;font-size:9.5px;font-weight:700;display:grid;place-items:center}

.panel{position:absolute;top:55px;z-index:1;border-radius:0 0 20px 20px;padding:0 1px 1px;background:linear-gradient(180deg,var(--filo),rgba(201,210,230,.18));box-shadow:0 30px 60px -22px rgba(0,0,0,.9);transform-origin:top;animation:entrar .5s cubic-bezier(.22,1.1,.36,1) both}
.panel-dentro{border-radius:0 0 19px 19px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.seccion{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--filo);padding:13px;display:flex;flex-direction:column;gap:10px;animation:subir .5s cubic-bezier(.22,1.1,.36,1) both}
.cabecera{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.cabecera .icono{color:var(--acento);display:grid}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--texto)}
.estado i{width:7px;height:7px;border-radius:50%;background:var(--verde);display:block}
.boton-texto{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--filo);transition:background .2s,border-color .2s}
.boton-texto:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
.boton-icono{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--plata);background:rgba(255,255,255,.05);border:1px solid var(--filo);transition:transform .3s,background .2s}
.boton-icono:hover{background:rgba(255,255,255,.1)}
.girando svg{animation:girar 1s linear infinite}

.redes{max-height:176px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(230,233,242,.45) transparent}
.redes::-webkit-scrollbar{width:10px}
.redes::-webkit-scrollbar-thumb{background:rgba(230,233,242,.45);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
.redes::-webkit-scrollbar-button{display:none;height:0}
.red{display:grid;grid-template-columns:22px minmax(0,1fr) 18px 36px;align-items:center;gap:10px;padding:8px;border-radius:10px;font-size:13px;text-align:left;transition:background .2s}
.red:hover{background:rgba(255,255,255,.05)}
.red.elegida{background:rgba(141,169,232,.12);box-shadow:inset 0 0 0 1px rgba(141,169,232,.45)}
.red .pct{font-size:11.5px;color:var(--tenue);text-align:right;font-variant-numeric:tabular-nums}

.velocidad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cifra{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--tenue)}
.cifra b{font-size:20px;font-weight:600;color:var(--texto);font-variant-numeric:tabular-nums}
.barra-medida{position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.barra-medida span{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--acento),transparent);animation:medir 1.2s ease-in-out infinite}

.acciones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.accion{height:62px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;color:var(--plata);background:rgba(255,255,255,.035);border:1px solid var(--filo);transition:transform .3s cubic-bezier(.34,1.4,.64,1),background .3s,border-color .3s}
.accion:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
.accion:disabled{opacity:.4;cursor:not-allowed}
.accion.peligro:hover{background:rgba(217,130,110,.12);border-color:rgba(217,130,110,.45)}

@media (prefers-reduced-motion:reduce){.nb *{animation:none!important}}
</style>
</helmet>
<div class="nb" style="--acento: {{accent}}; position: relative; width: 720px; height: 740px; overflow: hidden; background: linear-gradient(160deg, #1b2130 0%, #10141d 45%, #0a0c12 100%);">

  <div class="isla-borde">
    <div class="isla">
      <img src="/_blob/6d5b0ce4dc72fddea414eeb915593619" alt="">
      <img src="/_blob/07e3c1f6fdbbb26062f6f6eddc01e70f" alt="">
      <img src="/_blob/be47ad89d05d24e5d04398b75ed6b736" alt="">
      <img class="oscuro" src="/_blob/b82066d331d454bdae2321d5e0545c8d" alt="">
      <img src="/_blob/c55c03934836160ba79f8a368fa26df2" alt="">
      <div class="sep" aria-hidden="true"></div>
      <span class="chip-es">ES</span>
      <span class="ic abierto" aria-label="Red (abierto)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19" r="1" fill="currentColor"></circle></svg></span>
      <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></span>
      <span class="ic"><svg width="20" height="16" viewBox="0 0 28 16" aria-hidden="true"><rect x="1" y="2" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect><rect x="3" y="4" width="18" height="8" rx="1.5" fill="currentColor"></rect></svg></span>
      <div class="sep" aria-hidden="true"></div>
      <span class="reloj">{{hora}}</span>
      <div class="sep" aria-hidden="true"></div>
      <span class="ic" style="position: relative;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"></path></svg><span class="insignia">3</span></span>
      <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></span>
      <span class="fecha">{{fecha}}</span>
    </div>
  </div>

  <div class="panel" style="width: 420px; right: 150px;">
    <div class="panel-dentro">

      <div class="seccion" style="animation-delay: 60ms;">
        <div class="cabecera">
          <span class="icono"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path></svg></span>
          Red e Internet
          <span class="estado" style="margin-left: auto;"><i></i>Conectado</span>
        </div>
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="color: var(--acento); display: grid;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path></svg></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-size: 13.5px; font-weight: 600;">[Tu red] <span style="color: var(--tenue); font-weight: 400;">· 89 %</span></span>
            <span style="font-size: 11.5px; color: var(--tenue);">[IP] · 400 Mb/s · Wi-Fi 6E</span>
          </div>
          <button class="boton-texto">Desconectar</button>
        </div>
      </div>

      <div class="seccion" style="animation-delay: 110ms;">
        <div class="cabecera">
          <span class="icono"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path></svg></span>
          Redes Wi-Fi
          <button class="boton-icono {{girando}}" style="margin-left: auto;" aria-label="Buscar redes otra vez" onClick="{{rebuscar}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg></button>
        </div>
        <div class="redes">
          <sc-for list="{{redes}}" as="r" hint-placeholder-count="6">
            <button class="red {{r.clase}}" onClick="{{r.elegir}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--plata)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{r.ondas}}"></path></svg>
              <span>{{r.nombre}}</span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--tenue)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              <span class="pct">{{r.senal}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div class="seccion" style="animation-delay: 160ms;">
        <div class="cabecera">
          <span class="icono"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg></span>
          Velocidad
        </div>
        <div class="velocidad">
          <div class="cifra">Ping<b>—</b></div>
          <div class="cifra">Bajada<b>—</b></div>
          <div class="cifra">Subida<b>—</b></div>
        </div>
        <sc-if value="{{midiendo}}" hint-placeholder-val="{{false}}">
          <div class="barra-medida" aria-hidden="true"><span></span></div>
        </sc-if>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 11.5px; color: var(--tenue);">{{notaVelocidad}}</span>
          <button class="boton-texto" onClick="{{alternarMedir}}">{{textoMedir}}</button>
        </div>
      </div>

      <div class="seccion" style="animation-delay: 210ms;">
        <div class="acciones">
          <button class="accion"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>Actualizar</button>
          <button class="accion" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 15l6-6M10 6l2-2a4 4 0 0 1 6 6l-2 2M14 18l-2 2a4 4 0 0 1-6-6l2-2"></path></svg>Conectar</button>
          <button class="accion peligro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Desconectar</button>
          <button class="accion"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>Medir velocidad</button>
          <button class="accion"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>Ajustes de Windows</button>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8DA9E8","options":["#8DA9E8","#9FB4C7","#7FA8B8","#A9A3D0"]},"$preview":{"width":720,"height":740}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ahora: new Date(), elegida: null, buscando: false, midiendo: false };
  }
  componentDidMount() { this.reloj = setInterval(() => this.setState({ ahora: new Date() }), 1000); }
  componentWillUnmount() { clearInterval(this.reloj); clearTimeout(this.t1); }
  renderVals() {
    const a = this.state.ahora, dos = (n) => String(n).padStart(2, '0');
    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const ondas = (s) => s >= 80 ? 'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0' : s >= 60 ? 'M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0' : 'M8.5 16a5 5 0 0 1 7 0';
    const redes = [87, 87, 85, 67, 60, 42].map((s, i) => ({
      nombre: '[Red cercana ' + (i + 1) + ']', senal: s + '%', ondas: ondas(s),
      clase: this.state.elegida === i ? 'elegida' : '',
      elegir: () => this.setState({ elegida: i }),
    }));
    return {
      accent: this.props.accent ?? '#8DA9E8',
      hora: dos(a.getHours()) + ':' + dos(a.getMinutes()),
      fecha: dias[a.getDay()] + ' ' + a.getDate() + ' ' + meses[a.getMonth()],
      redes,
      girando: this.state.buscando ? 'girando' : '',
      rebuscar: () => { this.setState({ buscando: true }); clearTimeout(this.t1); this.t1 = setTimeout(() => this.setState({ buscando: false }), 1500); },
      midiendo: this.state.midiendo,
      textoMedir: this.state.midiendo ? 'Cancelar' : 'Medir',
      notaVelocidad: this.state.midiendo ? 'Midiendo… unos 15 s' : 'Tarda unos 15 s y gasta datos',
      alternarMedir: () => this.setState({ midiendo: !this.state.midiendo }),
    };
  }
}
</script>
</body>
</html>
