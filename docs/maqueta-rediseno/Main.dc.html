<style>
body{margin:0}
a{color:#8DA9E8}a:hover{color:#B8C7EC}
/* Todo lo de aquí tiene equivalente en WPF: colores sólidos y con alfa, degradados LINEALES
   (también rotando), sombras difuminadas (DropShadowEffect), escalas y desplazamientos con
   muelle. Nada de desenfocar lo que hay detrás ni degradados cónicos. */
.nb{--plata:#C9D2E6;--acero:#5E6E8F;--coral:#D9826E;--texto:#E6E9F2;--tenue:#9AA3B8;--ficha:#161A24;--filo:rgba(255,255,255,.09);--panel:rgba(12,14,20,.94);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--texto)}
.nb *{box-sizing:border-box}
.nb button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.nb button:focus-visible,.nb input:focus-visible{outline:2px solid var(--acento);outline-offset:3px}

/* ---------- La isla, desplegada ---------- */
.isla-sitio{position:absolute;top:10px;left:50%;width:960px;margin-left:-480px;z-index:5}
.halo{position:absolute;inset:0;border-radius:23px;box-shadow:0 0 26px 2px var(--acento);opacity:.14;animation:respirar 6s ease-in-out infinite}
.borde{position:relative;border-radius:23px;padding:1px;overflow:hidden;isolation:isolate;background:var(--filo)}
.borde::before{content:"";position:absolute;left:50%;top:50%;width:1100px;height:1100px;margin:-550px 0 0 -550px;background:linear-gradient(90deg,transparent 40%,rgba(201,210,230,.6) 49%,var(--acento) 51%,transparent 60%);animation:girar 9s linear infinite;z-index:-1}
.isla{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:46px;padding:0 10px;border-radius:22px;background:var(--panel)}
.zona{display:flex;align-items:center;gap:6px}
.sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 5px}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes respirar{0%,100%{opacity:.08}50%{opacity:.2}}

.boton-inicio{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.4,.64,1),background .3s}
.boton-inicio:hover{transform:scale(1.08);background:rgba(255,255,255,.07)}
.boton-inicio.abierto{background:rgba(141,169,232,.16)}

.app{position:relative;width:32px;height:34px;display:grid;place-items:center;border-radius:8px;transition:transform .35s cubic-bezier(.34,1.4,.64,1),background .3s}
.app img{width:22px;height:22px;display:block}
.app:hover{transform:translateY(-2px) scale(1.08);background:rgba(255,255,255,.06)}
.app.oscuro img{filter:drop-shadow(0 0 3px rgba(255,255,255,.85))}
.punto{position:absolute;bottom:0;left:50%;width:4px;height:3px;margin-left:-2px;border-radius:2px;background:var(--tenue)}
.punto.activo{width:12px;margin-left:-6px;background:var(--acento)}
.vista{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--plata)}
.vista:hover{background:rgba(255,255,255,.07)}

.chip-es{font-size:12px;font-weight:600;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--plata)}
.icono-sis{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--plata);transition:background .2s}
.icono-sis:hover{background:rgba(255,255,255,.07)}
.reloj-isla{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px;background:linear-gradient(90deg,var(--texto) 40%,#fff 50%,var(--texto) 60%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fluir 7s linear infinite}
.fecha-isla{font-size:13px;color:var(--plata);padding:0 6px}
.campana{position:relative}
.insignia{position:absolute;top:2px;right:1px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--coral);color:#1a0f0c;font-size:9.5px;font-weight:700;display:grid;place-items:center;animation:latido 2.4s ease-out infinite}
@keyframes fluir{to{background-position:-250% center}}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(217,130,110,.5)}100%{box-shadow:0 0 0 6px rgba(217,130,110,0)}}

/* ---------- El Inicio: una tarjeta que sale de la isla ---------- */
.inicio{position:absolute;top:44px;left:0;width:570px;z-index:-1;border-radius:0 0 20px 20px;padding:0 1px 1px;background:linear-gradient(180deg,var(--filo),rgba(201,210,230,.18));box-shadow:0 34px 70px -24px rgba(0,0,0,.9);transform-origin:top left;animation:entrar .55s cubic-bezier(.22,1.1,.36,1) both}
.inicio-dentro{border-radius:0 0 19px 19px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px}
@keyframes entrar{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
.escalon{animation:subir .55s cubic-bezier(.22,1.1,.36,1) both}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.tarjeta{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--filo);padding:14px}
.reloj-grande{font-size:44px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,var(--plata) 70%,var(--acero));-webkit-background-clip:text;background-clip:text;color:transparent}

.buscador{position:relative;border-radius:12px;padding:1px;background:var(--filo);overflow:hidden;isolation:isolate}
.buscador::before{content:"";position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:linear-gradient(90deg,transparent 42%,var(--acento) 50%,transparent 58%);animation:girar 4s linear infinite;opacity:0;transition:opacity .3s;z-index:-1}
.buscador:focus-within::before,.buscador:hover::before{opacity:.9}
.buscador-dentro{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:11px;background:#12151d}
.buscador input{flex:1;height:100%;border:0;outline:0;background:transparent;color:var(--texto);font:inherit;font-size:14.5px}
.buscador input::placeholder{color:#8891A6}

.musica{display:flex;gap:14px;align-items:center}
.caratula{width:72px;height:72px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#262E40,var(--acero));box-shadow:0 12px 24px -12px rgba(0,0,0,.9);color:var(--plata);font-size:10.5px;text-align:center;line-height:1.2}
.progreso{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.progreso-lleno{position:relative;height:100%;width:42%;border-radius:2px;background:var(--acento);overflow:hidden}
.progreso-lleno::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);background-size:200% 100%;animation:fluir 2.8s linear infinite}
.control{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--plata);transition:transform .25s,background .25s}
.control:hover{transform:scale(1.08);background:rgba(255,255,255,.07)}
.play{width:42px;height:42px;background:var(--texto);color:#0c0e14}
.play:hover{background:#fff}
.eq{display:flex;align-items:flex-end;gap:3px;height:24px}
.barra{width:3px;border-radius:2px;background:var(--acento);opacity:.75;animation:eq 1.2s ease-in-out infinite}
.pausado .barra{animation-play-state:paused}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

.teclas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tecla{height:54px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.035);border:1px solid var(--filo);font-size:12px;font-weight:600;color:var(--tenue);transition:transform .3s cubic-bezier(.34,1.4,.64,1),border-color .3s,background .3s,color .3s}
.tecla:hover{transform:translateY(-2px);background:rgba(255,255,255,.06);color:var(--texto)}
.tecla.activa{color:#fff;background:rgba(141,169,232,.1);border-color:var(--acento)}

.energia{display:flex;justify-content:flex-end;gap:8px}
.energia-boton{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--plata);background:rgba(255,255,255,.035);border:1px solid var(--filo);transition:transform .3s cubic-bezier(.34,1.4,.64,1),background .3s,border-color .3s}
.energia-boton:hover{transform:translateY(-2px);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
.energia-boton.apagar:hover{background:rgba(217,130,110,.12);border-color:rgba(217,130,110,.45)}
.titulo-seccion{font-size:11.5px;font-weight:600;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}

.calmado .deco,.calmado .deco::before,.calmado .deco::after{animation:none!important}
@media (prefers-reduced-motion:reduce){.nb .deco,.nb .deco::before,.nb .deco::after,.nb .barra{animation:none!important}}
</style>

      inicioAbierto: abierto,
      inicioClase: abierto ? 'abierto' : '',
      alternarInicio: () => this.setState({ inicio: !abierto }),
      sonando: sonando,
      parado: !sonando,
      pausa: sonando ? '' : 'pausado',
      etiquetaPlay: sonando ? 'Pausar' : 'Reproducir',
      alternarPlay: () => this.setState({ sonando: !sonando }),
      barras: Array.from({ length: 7 }, (_, i) => ({
        retraso: (-(i * 137) % 1000) + 'ms',
        duracion: (800 + ((i * 263) % 600)) + 'ms',
      })),
      teclaActiva: this.state.tecla,
      teclados: ['ES', 'EN-US', 'EN-ES'].map((nombre) => ({
        nombre,
        clase: nombre === this.state.tecla ? 'activa' : '',
        elegir: () => this.setState({ tecla: nombre }),
      })),
    };
  }
}
</script>
</body>
</html>
