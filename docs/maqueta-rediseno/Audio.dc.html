.salida{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;font-size:13px;background:rgba(141,169,232,.1);box-shadow:inset 0 0 0 1px rgba(141,169,232,.4);color:#fff}
.app-fila{display:grid;grid-template-columns:30px minmax(0,1fr) 34px;align-items:center;gap:10px}
