<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NubeBar · Panel de batería</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8DA9E8;text-decoration:none}a:hover{color:#B8C7EC}
.nb{--plata:#C9D2E6;--coral:#D9826E;--verde:#8FC1A0;--texto:#E6E9F2;--tenue:#9AA3B8;--filo:rgba(255,255,255,.09);--panel:rgba(12,14,20,.94);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--texto)}
.nb *{box-sizing:border-box}
.nb button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.nb button:focus-visible,.nb a:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes fluir{to{background-position:-250% center}}
@keyframes entrar{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes llenar{from{width:0}}

.isla-borde{position:absolute;top:10px;right:20px;width:760px;border-radius:23px;padding:1px;overflow:hidden;isolation:isolate;background:var(--filo);z-index:2}
.isla-borde::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:linear-gradient(90deg,transparent 40%,rgba(201,210,230,.6) 49%,var(--acento) 51%,transparent 60%);animation:girar 9s linear infinite;z-index:-1}
.isla{display:flex;align-items:center;justify-content:flex-end;gap:6px;height:46px;padding:0 12px;border-radius:22px;background:var(--panel)}
.isla img{width:22px;height:22px;display:block}
.isla .oscuro{filter:drop-shadow(0 0 3px rgba(255,255,255,.85))}
.sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 5px}
.ic{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--plata)}
.ic.abierto{background:rgba(141,169,232,.18);color:#fff}
.chip-es{font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--plata)}
.reloj{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--texto) 40%,#fff 50%,var(--texto) 60%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fluir 7s linear infinite}
.fecha{font-size:13px;color:var(--plata);padding:0 4px}
.insignia{position:absolute;top:2px;right:1px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--coral);color:#1a0f0c;font-size:9.5px;font-weight:700;display:grid;place-items:center}

.panel{position:absolute;top:55px;z-index:1;border-radius:0 0 20px 20px;padding:0 1px 1px;background:linear-gradient(180deg,var(--filo),rgba(201,210,230,.18));box-shadow:0 30px 60px -22px rgba(0,0,0,.9);transform-origin:top;animation:entrar .5s cubic-bezier(.22,1.1,.36,1) both}
.panel-dentro{border-radius:0 0 19px 19px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px}
.escalon{animation:subir .5s cubic-bezier(.22,1.1,.36,1) both}
.nivel{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.nivel span{display:block;height:100%;border-radius:3px;background:var(--acento);animation:llenar 1s cubic-bezier(.22,1,.36,1) both}
.titulo-seccion{font-size:11.5px;font-weight:600;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
.modos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--filo)}
.modo{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--tenue);transition:background .3s,color .3s}
.modo:hover{color:var(--texto);background:rgba(255,255,255,.05)}
.modo.activo{color:#fff;background:rgba(141,169,232,.18);box-shadow:inset 0 0 0 1px rgba(141,169,232,.55)}

@media (prefers-reduced-motion:reduce){.nb *{animation:none!important}}
</style>
</helmet>
<div class="nb" style="--acento: {{accent}}; position: relative; width: 720px; height: 340px; overflow: hidden; background: linear-gradient(160deg, #1b2130 0%, #10141d 45%, #0a0c12 100%);">

  <div class="isla-borde">
    <div class="isla">
      <img src="/_blob/6d5b0ce4dc72fddea414eeb915593619" alt="">
      <img src="/_blob/07e3c1f6fdbbb26062f6f6eddc01e70f" alt="">
      <img src="/_blob/be47ad89d05d24e5d04398b75ed6b736" alt="">
      <img class="oscuro" src="/_blob/b82066d331d454bdae2321d5e0545c8d" alt="">
      <img src="/_blob/c55c03934836160ba79f8a368fa26df2" alt="">
      <div class="sep" aria-hidden="true"></div>
      <span class="chip-es">ES</span>
      <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19" r="1" fill="currentColor"></circle></svg></span>
      <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></span>
      <span class="ic abierto" aria-label="Batería (abierto)"><svg width="20" height="16" viewBox="0 0 28 16" aria-hidden="true"><rect x="1" y="2" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect><rect x="3" y="4" width="18" height="8" rx="1.5" fill="currentColor"></rect></svg></span>
      <div class="sep" aria-hidden="true"></div>
      <span class="reloj">{{hora}}</span>
      <div class="sep" aria-hidden="true"></div>
      <span class="ic" style="position: relative;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"></path></svg><span class="insignia">3</span></span>
      <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></span>
      <span class="fecha">{{fecha}}</span>
    </div>
  </div>

  <div class="panel" style="width: 370px; right: 110px;">
    <div class="panel-dentro">

      <div class="escalon" style="display: flex; align-items: center; gap: 14px; animation-delay: 60ms;">
        <svg width="40" height="24" viewBox="0 0 28 16" aria-hidden="true"><rect x="1" y="2" width="22" height="12" rx="3" fill="none" stroke="var(--acento)" stroke-width="1.6"></rect><rect x="24" y="5.5" width="2.5" height="5" rx="1" fill="var(--acento)"></rect><rect x="3" y="4" width="18" height="8" rx="1.5" fill="var(--acento)"></rect><path d="M13 4.5l-3 4h3l-1.5 3.5 4-5h-3l1.5-2.5z" fill="#0c0e14"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;">100 %</span>
          <span style="font-size: 12.5px; color: var(--tenue);">Enchufado · cargada</span>
        </div>
      </div>

      <div class="nivel escalon" style="animation-delay: 100ms;"><span style="width: 100%;"></span></div>

      <div class="escalon" style="display: flex; flex-direction: column; gap: 8px; animation-delay: 140ms;">
        <span class="titulo-seccion">Modo de energía</span>
        <div class="modos" role="radiogroup" aria-label="Modo de energía">
          <sc-for list="{{modos}}" as="m" hint-placeholder-count="3">
            <button class="modo {{m.clase}}" role="radio" aria-checked="{{m.marcado}}" onClick="{{m.elegir}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icono}}"></path></svg>
              {{m.nombre}}
            </button>
          </sc-for>
        </div>
      </div>

      <div class="escalon" style="display: flex; justify-content: space-between; align-items: center; padding-top: 2px; animation-delay: 180ms;">
        <span style="font-size: 12.5px; color: var(--tenue);">Ahorro de batería: desactivado</span>
        <a href="#" style="font-size: 12.5px; font-weight: 600;">Energía y batería ›</a>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8DA9E8","options":["#8DA9E8","#9FB4C7","#7FA8B8","#A9A3D0"]},"$preview":{"width":720,"height":340}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ahora: new Date(), modo: 2 };
  }
  componentDidMount() { this.reloj = setInterval(() => this.setState({ ahora: new Date() }), 1000); }
  componentWillUnmount() { clearInterval(this.reloj); }
  renderVals() {
    const a = this.state.ahora, dos = (n) => String(n).padStart(2, '0');
    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const modos = [
      ['Eficiencia', 'M7 20c8 0 13-6 13-16C10 4 4 9 4 16c0 1.5.5 3 1 4M4 20l7-7'],
      ['Equilibrado', 'M13 2L4 14h7l-1 8 9-12h-7z'],
      ['Rendimiento', 'M12 14l4-4M4 18a9 9 0 1 1 16 0'],
    ].map(([nombre, icono], i) => ({
      nombre, icono, clase: this.state.modo === i ? 'activo' : '', marcado: this.state.modo === i ? 'true' : 'false',
      elegir: () => this.setState({ modo: i }),
    }));
    return {
      accent: this.props.accent ?? '#8DA9E8',
      hora: dos(a.getHours()) + ':' + dos(a.getMinutes()),
      fecha: dias[a.getDay()] + ' ' + a.getDate() + ' ' + meses[a.getMonth()],
      modos,
    };
  }
}
</script>
</body>
</html>
