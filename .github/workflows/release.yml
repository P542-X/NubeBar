name: Release

# Al subir una etiqueta v* se compila el exe autónomo y se publica como Release.
# El exe NO vive en el repositorio: se construye aquí cada vez.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # para poder lanzarlo a mano desde la web

permissions:
  contents: write           # hace falta para crear la Release

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore -r win-x64

      - name: Publicar el exe autónomo de un solo archivo
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --no-restore
          -o dist

      - name: Comprobar que el exe existe
        shell: pwsh
        run: |
          $exe = "dist\NubeBar.exe"
          if (-not (Test-Path $exe)) { throw "no se generó $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "NubeBar.exe generado: $mb MB"
          if ($mb -lt 20) { throw "el exe pesa $mb MB: no parece autónomo" }

      - name: Guardarlo también como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NubeBar-win-x64
          path: dist/NubeBar.exe

      - name: Publicar la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NubeBar.exe
          generate_release_notes: true
          body: |
            Ejecutable autónomo para Windows 11 (x64). No necesita instalar .NET.

            Descarga `NubeBar.exe`, ábrelo y listo. La configuración se crea en
            `%APPDATA%\NubeBar\config.json`.
